services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign_db
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      ollama:
        condition: service_started
    command: sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - "./app:/app/app"
      - "./alembic:/app/alembic"
      - "./alembic.ini:/app/alembic.ini"
      - "./pyproject.toml:/app/pyproject.toml"
      - "./.env:/app/.env"

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    ports: ["5173:5173"]
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    volumes: [".:/app"]
    depends_on:
      api:
        condition: service_started

  worker:
    build: .
    env_file: .env
    depends_on: [api, redis, postgres]
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - "./app:/app/app"
      - "./alembic:/app/alembic"
      - "./alembic.ini:/app/alembic.ini"
      - "./pyproject.toml:/app/pyproject.toml"
      - "./.env:/app/.env"

  beat:
    build: .
    env_file: .env
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    volumes:
      - "./app:/app/app"
      - "./alembic:/app/alembic"
      - "./alembic.ini:/app/alembic.ini"
      - "./pyproject.toml:/app/pyproject.toml"
      - "./.env:/app/.env"

volumes:
  pgdata:
  minio:
  ollama:
